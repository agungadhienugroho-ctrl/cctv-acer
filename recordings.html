<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CCTV Rekaman</title>
<style>
:root {
    --bg: #0a0a1a;
    --bg-card: rgba(255,255,255,0.05);
    --bg-card-strong: rgba(255,255,255,0.08);
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.12);
    --text: #e0e0e0;
    --text-dim: #888;
    --text-muted: #555;
    --glass-blur: 40px;
}
[data-theme="light"] {
    --bg: #f0f2f5;
    --bg-card: rgba(255,255,255,0.7);
    --bg-card-strong: rgba(255,255,255,0.85);
    --border: rgba(0,0,0,0.08);
    --border-strong: rgba(0,0,0,0.12);
    --text: #1a1a2e;
    --text-dim: #555;
    --text-muted: #888;
    --glass-blur: 20px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);padding:15px;min-height:100vh}
.sticky-top{position:sticky;top:0;z-index:10;background:var(--bg);padding-bottom:10px}
#pl{background:#000;border-radius:12px;overflow:hidden;max-width:100%;display:none;margin-bottom:10px;position:sticky;top:50px;z-index:9}
video{width:100%;max-height:500px;display:block;background:#000}
.fl{list-style:none;display:grid;gap:8px}
.fi{background:var(--bg-card);padding:12px 16px;border-radius:10px;border:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:all .2s}
.fi:hover{background:var(--bg-card-strong);border-color:var(--border-strong)}
.fi.act{background:rgba(0,150,136,0.15);border-color:#00bcd4}
.fn{color:var(--text);font-size:14px}
.fm{color:var(--text-dim);font-size:12px}
.fs{color:#00bcd4;font-weight:bold;font-size:13px}
.ld{padding:30px;text-align:center;color:var(--text-dim)}
.em{color:var(--text-muted);text-align:center;padding:40px}
.rb{background:var(--bg-card);color:var(--text-dim);border:1px solid var(--border);padding:8px 14px;border-radius:8px;cursor:pointer;margin-bottom:0;font-size:13px;transition:all .2s}
.rb:hover{background:var(--bg-card-strong);border-color:var(--border-strong);color:var(--text)}
.bg{display:inline-block;background:#00bcd4;color:#000;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:bold}
</style>
</head>
<body>

<div class="sticky-top">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px"><a href="/cctv.html" style="display:inline-flex;align-items:center;gap:4px;padding:6px 10px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;color:var(--text-dim);text-decoration:none;font-size:13px"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Kembali</a><span style="display:flex;align-items:center;gap:10px"><span style="color:#00bcd4;font-size:22px;font-weight:bold"> Rekaman</span><span id="cnt" class="bg">0</span></span></div>
  <div id="pl">
    <video id="vp" controls></video>
  </div>
  <button class="rb" onclick="load()">Refresh</button>
</div>

<div id="ls" class="ld">Memuat daftar rekaman...</div>

<script>
const A='http://192.168.110.7:8090';
const ls=document.getElementById('ls'),cn=document.getElementById('cnt'),vp=document.getElementById('vp');

// Ikuti theme dari dashboard utama
const t=localStorage.getItem('theme');
if(t) document.documentElement.setAttribute('data-theme',t);

async function load(){
  try{
    ls.innerHTML='<div class="ld">Memuat daftar rekaman...</div>';
    const r=await fetch(A+'/api/recordings');
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    cn.textContent=d.length;
    if(!d.length){ls.innerHTML='<div class="em">Belum ada rekaman</div>';return;}
    // Sort by date descending (terbaru di atas)
    d.sort(function(a,b){return b.date.localeCompare(a.date)||b.file.localeCompare(a.file)});
    let h='<ul class="fl">';
    d.forEach(function(f){
      var sizeMB=(f.size/1024/1024).toFixed(1);
      h+='<li class="fi" onclick="play(\''+f.file+'\')" ondblclick="dl(\''+f.file+'\')">'+
        '<div><div class="fn">'+f.file+'</div><div class="fm">'+f.date+'</div></div>'+
        '<div class="fs">'+sizeMB+' MB</div></li>';
    });
    h+='</ul>';
    ls.innerHTML=h;
  }catch(e){ls.innerHTML='<div class="em">Gagal: '+e.message+'</div>';}
}

function play(fn){
  document.getElementById('pl').style.display='block';
  vp.src=A+'/api/download/'+encodeURIComponent(fn);
  vp.load();
  vp.play();
  document.querySelectorAll('.fi').forEach(function(e){e.classList.remove('act');});
}

function dl(fn){window.open(A+'/api/download/'+encodeURIComponent(fn),'_blank');}

load();
</script>
</body>
</html>
