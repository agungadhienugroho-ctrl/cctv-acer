server {
    listen 80;
    server_name _;
    root /config/www;
    index index.php index.html;

    location = /cctv.jpg {
        alias /config/www/hls/snapshot.jpg;
        add_header Cache-Control no-cache;
        add_header Access-Control-Allow-Origin *;
    }

    location = /cctv_local.jpg {
        alias /config/www/cctv.jpg;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires off;
        etag off;
        if_modified_since off;
    }

    location /vaultwarden {
        return 301 https://$host:8013$request_uri;
    }

    location ~ \.php$ {
        include /etc/nginx/fastcgi_params;
        fastcgi_pass 192.168.110.7:9999;
        fastcgi_param SCRIPT_FILENAME /DATA/AppData/nginx/config/www/$fastcgi_script_name;
    }

    location /ws/ {
        proxy_pass http://172.24.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600;
    }

    location /api/ {
        proxy_pass http://172.24.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 100M;
    }

    location /hls/ {
        alias /config/www/hls/;
        add_header Cache-Control no-cache;
        add_header Access-Control-Allow-Origin *;
    }


    location /rekaman/ {
        alias /storage1/CCTV/Rekaman/;
        autoindex on;
        add_header Access-Control-Allow-Origin "*";
    }
    location / {
        try_files $uri $uri/ =404;
    }
}