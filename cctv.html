<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>CCTV - NuG Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg: #0a0a1a;
            --bg-card: rgba(255,255,255,0.05);
            --bg-card-strong: rgba(255,255,255,0.08);
            --border: rgba(255,255,255,0.08);
            --border-strong: rgba(255,255,255,0.12);
            --text: #e0e0e0;
            --text-dim: #888;
            --text-muted: #555;
            --glow-1: rgba(59,130,246,0.08);
            --glow-2: rgba(16,185,129,0.06);
            --glow-3: rgba(139,92,246,0.05);
            --grid-line: rgba(255,255,255,0.02);
            --glass-blur: 40px;
        }
        [data-theme="light"] {
            --bg: #f0f2f5;
            --bg-card: rgba(255,255,255,0.7);
            --bg-card-strong: rgba(255,255,255,0.85);
            --border: rgba(0,0,0,0.08);
            --border-strong: rgba(0,0,0,0.12);
            --text: #1a1a2e;
            --text-dim: #555;
            --text-muted: #888;
            --glow-1: rgba(59,130,246,0.05);
            --glow-2: rgba(16,185,129,0.04);
            --glow-3: rgba(139,92,246,0.03);
            --grid-line: rgba(0,0,0,0.03);
            --glass-blur: 20px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.4s ease, color 0.4s ease;
        }
        .bg-glow {
            position: fixed; inset: 0; z-index: 0;
            background:
                radial-gradient(600px circle at 20% 30%, var(--glow-1) 0%, transparent 70%),
                radial-gradient(500px circle at 80% 60%, var(--glow-2) 0%, transparent 70%),
                radial-gradient(400px circle at 50% 80%, var(--glow-3) 0%, transparent 70%);
            animation: pulse-bg 8s ease-in-out infinite alternate;
        }
        @keyframes pulse-bg { 0% { opacity: 0.6; } 100% { opacity: 1; } }
        .grid-overlay {
            position: fixed; inset: 0; z-index: 0;
            background-image:
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 50px 50px;
            mask-image: radial-gradient(ellipse at center, black 20%, transparent 70%);
        }
        .content { position: relative; z-index: 1; }
        .glass {
            background: var(--bg-card);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--border);
            border-radius: 16px;
            transition: background 0.4s ease, border-color 0.4s ease;
        }
        .glass-strong {
            background: var(--bg-card-strong);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--border-strong);
            border-radius: 12px;
        }
        .live-dot {
            width: 8px; height: 8px; background: #ef4444;
            border-radius: 50%; display: inline-block;
            box-shadow: 0 0 8px rgba(239,68,68,0.6);
            animation: pulse-dot 1.5s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; box-shadow: 0 0 8px rgba(239,68,68,0.6); }
            50% { opacity: 0.5; box-shadow: 0 0 16px rgba(239,68,68,0.3); }
        }
        .stream-box {
            overflow: hidden; border-radius: 12px;
            position: relative; aspect-ratio: 4/3; max-height: 70vh;
            background: #000;
        }
        .stream-box video {
            width: 100%; height: 100%; object-fit: cover; display: block;
        }
        .snapshot-mode .video-el { display: none !important; }
        .snapshot-mode .snapshot-el { display: block !important; }
        .video-mode .snapshot-el { display: none !important; }
        .video-mode .video-el { display: block !important; }
        #snapshot-canvas { width: 100%; height: 100%; object-fit: contain; }
        .pinch-zoom { touch-action: none; }
        /* Header buttons — match NuG style */
        .header-btn {
            background: var(--bg-card); border: 1px solid var(--border);
            color: var(--text-dim); padding: 6px 12px;
            border-radius: 12px; font-size: 11px; cursor: pointer;
            transition: all 0.3s ease; display: flex; flex-direction: column; align-items: center; gap: 3px; font-weight: 500;
        }
        .header-btn:hover {
            background: var(--bg-card-strong);
            border-color: var(--border-strong);
            color: var(--text); transform: translateY(-1px);
        }
        .header-btn.active {
            background: linear-gradient(135deg, rgba(59,130,246,0.2), rgba(59,130,246,0.1));
            border-color: rgba(59,130,246,0.4);
            color: #60a5fa;
        }
        .header-btn.sound-on {
            background: linear-gradient(135deg, rgba(16,185,129,0.2), rgba(16,185,129,0.1));
            border-color: rgba(16,185,129,0.4);
            color: #34d399;
        }
        .rec-dot {
            width: 8px; height: 8px; background: #ef4444;
            border-radius: 50%; animation: blink 1s infinite;
        }
        @keyframes blink { 50% { opacity: 0.3; } }
        /* Theme toggle */
        .theme-toggle {
            background: var(--bg-card); border: 1px solid var(--border);
            color: #eab308; padding: 6px; border-radius: 50%;
            width: 32px; height: 32px; display: flex;
            align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.3s ease;
        }
        .theme-toggle:hover {
            background: var(--bg-card-strong);
            transform: rotate(20deg);
        }
    </style>
</head>
<body>
<div class="bg-glow"></div>
<div class="grid-overlay"></div>
<div class="content p-4 max-w-4xl mx-auto">
    <!-- Header — match NuG Dashboard style -->
    <header class="flex justify-between items-center mb-4">
        <div class="flex items-center gap-3">
            <h1 class="text-lg font-black" style="color:var(--text)">
                <span style="color:#3b82f6">📹</span> CCTV
            </h1>
            <span id="stream-status" class="text-[10px] flex items-center gap-1.5 glass px-2 py-0.5 rounded-full">
                <span class="live-dot"></span><span style="color:#10b981;font-weight:600">LIVE</span>
            </span>
            <span id="stream-mode" class="text-[9px] glass px-2 py-0.5 rounded-full" style="color:#60a5fa;border-color:rgba(59,130,246,0.3)">HLS+AUDIO</span>
        </div>
        <div class="flex items-center gap-2">
            <a href="/index.html" class="header-btn" style="padding:8px;justify-content:center;" title="Dashboard">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </a>
            <button onclick="location.reload()" class="header-btn" style="text-align:center;justify-content:center;" style="padding:6px">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-9-9c2.52 0 4.93.94 6.74 2.5L21 8"/><path d="M21 3v5h-5"/></svg>
            </button>
            <a href="/recordings.html" class="header-btn" style="padding:8px;justify-content:center;" title="Rekaman">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
            </a>
        </div>
    </header>

    <!-- Control pills — match NuG style -->
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:12px;">
        <!-- Baris 1 -->
        <button id="btn-hls" class="header-btn active" style="text-align:center;justify-content:center;" onclick="switchMode('hls')">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
            Live + Audio
        </button>
        <button class="header-btn" style="text-align:center;justify-content:center;" onclick="downloadScreenshot()">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
            Screenshot
        </button>
        <!-- Baris 2 -->
        <button id="btn-sound" class="header-btn" style="text-align:center;justify-content:center;" onclick="toggleSound()">
            <svg id="sound-icon-on" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg>
            <svg id="sound-icon-off" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
            <span id="sound-label">Sound Off</span>
        </button>
        <button class="header-btn" style="text-align:center;justify-content:center;" onclick="zoomIn()">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
            Zoom +
        </button>
        <!-- Baris 3 -->
        <button class="header-btn" style="text-align:center;justify-content:center;" onclick="zoomOut()">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
            Zoom -
        </button>
        <button class="header-btn" style="text-align:center;justify-content:center;" onclick="zoomReset()">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            Reset
        </button>
    </div>

    <!-- Video containers -->
    <div id="hls-container" class="stream-box video-el">
        <video id="hls-video" playsinline autoplay></video>
    </div>
    <div id="snapshot-container" class="stream-box snapshot-el pinch-zoom" style="display:none">
        <canvas id="snapshot-canvas" width="640" height="480"></canvas>
    </div>

    <!-- Info bar -->
    <div class="glass-strong px-3 py-1.5 mt-2 flex justify-between items-center text-[9px]" style="color:var(--text-dim)">
        <span class="flex items-center gap-1">
            <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
            <span id="info-resolution">640x480</span>
        </span>
        <span class="flex items-center gap-1">
            <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
            <span id="info-codec">H.264 + AAC</span>
        </span>
        <span class="flex items-center gap-1">
            <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span id="info-latency">--</span>
        </span>
    </div>

    <!-- Recordings section — match NuG card style -->
    <div class="glass p-4 mt-3">
        <div class="flex justify-between items-center mb-3">
            <h2 class="text-xs font-bold flex items-center gap-1.5" style="color:var(--text)">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="17" x2="22" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/></svg>
                Recordings
            </h2>
            <span id="rec-status" class="text-[9px] flex items-center gap-1" style="color:var(--text-dim)">Not recording</span>
        </div>
        <div id="recordings-list" class="space-y-1.5 max-h-40 overflow-y-auto" style="font-size:11px;color:var(--text-dim)">
            <div class="text-center py-3" style="color:var(--text-muted)">No recordings</div>
        </div>
    </div>
</div>

<script>
// Theme - read localStorage sync with main dashboard
const savedTheme = localStorage.getItem('theme') || 'dark';
document.body.setAttribute('data-theme', savedTheme);

const HLS_URL='http://192.168.110.7:8011/hls/index.m3u8',SNAPSHOT_URL='/cctv.jpg',API='http://192.168.110.7:8090/api/record',MAX_DUR=600;
let hls=null,currentMode='hls',isRecording=false,recInterval=null,snapshotInterval=null,audioEnabled=false;

function initHLS(){
  const video=document.getElementById('hls-video');
  if(Hls.isSupported()){
    hls=new Hls({enableWorker:true,backBufferLength:60,maxBufferLength:60,maxMaxBufferLength:120,startFragPrefetch:true,liveSyncDurationCount:3,liveDurationInfinity:true});
    hls.loadSource(HLS_URL+'?t='+Date.now());hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED,function(){
      document.getElementById('stream-status').innerHTML='<span class="live-dot"></span><span style="color:#10b981;font-weight:600">LIVE</span>';
      updateInfo();
    });
    hls.on(Hls.Events.ERROR,function(e,d){
      if(d.fatal){
        document.getElementById('stream-status').innerHTML='<span class="rec-dot"></span><span style="color:#ef4444">Buffering...</span>';
        setTimeout(function(){hls.loadSource(HLS_URL+'?t='+Date.now());},3000);
      }
    });
  }else if(video.canPlayType('application/vnd.apple.mpegurl')){
    video.src=HLS_URL;
    video.addEventListener('loadedmetadata',function(){
      document.getElementById('stream-status').innerHTML='<span class="live-dot"></span><span style="color:#10b981;font-weight:600">LIVE</span>';
      updateInfo();
    });
  }
}

function updateInfo(){
  const v=document.getElementById('hls-video');
  if(v.videoWidth) document.getElementById('info-resolution').textContent=v.videoWidth+'x'+v.videoHeight;
  if(hls&&hls.bandwidthEstimate) document.getElementById('info-latency').textContent='BW:'+(hls.bandwidthEstimate/1000).toFixed(0)+'kbps';
}

function startSnapshot(){
  const canvas=document.getElementById('snapshot-canvas');
  const ctx=canvas.getContext('2d');
  function fetchFrame(){
    const img=new Image();
    img.onload=function(){canvas.width=img.width;canvas.height=img.height;ctx.drawImage(img,0,0);document.getElementById('info-resolution').textContent=img.width+'x'+img.height;};
    img.onerror=function(){document.getElementById('stream-status').innerHTML='<span style="color:#eab308">● Reconnecting...</span>';};
    img.src=SNAPSHOT_URL+'?t='+Date.now();
  }
  fetchFrame();snapshotInterval=setInterval(fetchFrame,200);
}

function stopSnapshot(){if(snapshotInterval){clearInterval(snapshotInterval);snapshotInterval=null;}}

function switchMode(mode){
  currentMode=mode;
  document.getElementById('btn-hls').classList.toggle('active',mode==='hls');
  
  document.getElementById('stream-mode').textContent=mode==='hls'?'HLS+AUDIO':'JPEG';
  if(mode==='hls'){
    document.getElementById('hls-container').style.display='block';
    document.getElementById('snapshot-container').style.display='none';
    stopSnapshot();if(!hls)initHLS();
  }else{
    document.getElementById('hls-container').style.display='none';
    document.getElementById('snapshot-container').style.display='block';
    if(hls)hls.stopLoad();startSnapshot();
  }
}

function toggleSound(){
  const v=document.getElementById('hls-video');
  audioEnabled=!audioEnabled;v.muted=!audioEnabled;
  document.getElementById('btn-sound').classList.toggle('sound-on',audioEnabled);
  document.getElementById('sound-label').textContent=audioEnabled?'Sound On':'Sound Off';
  document.getElementById('sound-icon-on').style.display=audioEnabled?'block':'none';
  document.getElementById('sound-icon-off').style.display=audioEnabled?'none':'block';
}

async function toggleRecord(){
  if(isRecording){
    try { await fetch(API+'/stop'); stopRecUI(); }
    catch (e) { alert('Error stopping record: '+e.message); stopRecUI(); }
  } else {
    try {
      const r = await fetch(API+'/start');
      if (!r.ok) throw new Error(`HTTP error! status: ${r.status}`);
      const d = await r.json();
      if(d.status==='recording')startRecUI();else alert('Failed to start: '+(d.error||'Unknown'));
    } catch (e) { alert('Error starting record: '+e.message); }
  }
}

function startRecUI(){
  isRecording=true;
  document.getElementById('record-label').textContent='Stop';
  document.getElementById('btn-record').classList.add('active');
  document.getElementById('rec-status').innerHTML='<span class="rec-dot"></span> Recording...';
  recInterval=setInterval(async function(){
    const r=await fetch(API+'/status').then(function(x){return x.json();});
    if(!r.recording){stopRecUI();return;}
    const el=r.elapsed||0;
    document.getElementById('rec-status').innerHTML='<span class="rec-dot"></span> Recording '+fmtTime(el)+' / '+fmtTime(MAX_DUR);
    if(el>=MAX_DUR){await fetch(API+'/stop');stopRecUI();}
  },2000);
}

function stopRecUI(){
  isRecording=false;document.getElementById('record-label').textContent='Record';
  document.getElementById('btn-record').classList.remove('active');
  document.getElementById('rec-status').textContent='Not recording';
  if(recInterval){clearInterval(recInterval);recInterval=null;}
  loadRecordings();
}

function fmtTime(s){var m=Math.floor(s/60);var ss=s%60;return m+':'+(ss<10?'0':'')+ss;}

async function loadRecordings(){
  try{
    const r=await fetch(API.replace('/record','')+'/recordings');const f=await r.json();
    const l=document.getElementById('recordings-list');
    if(!f.length){l.innerHTML='<div class="text-center py-3" style="color:var(--text-muted)">No recordings</div>';return;}
    l.innerHTML=f.map(function(x){
      var sz=x.size>1048576?(x.size/1048576).toFixed(1)+'MB':(x.size/1024).toFixed(0)+'KB';
      return '<div class="flex justify-between items-center py-1.5 px-2 rounded-lg" style="background:var(--bg-card)">' +
        '<span style="color:var(--text)">'+x.file+'</span>' +
        '<span>'+sz+' • '+x.date+'</span>' +
        '<a href="' + API.replace('/api/record', '/api/download/') + x.file + '" target="_blank" style="color:#60a5fa;font-weight:600">▶ Play</a>' +
        '</div>';
    }).join('');
  }catch(e){document.getElementById('recordings-list').innerHTML='<div class="text-center py-3" style="color:var(--text-muted)">Error loading</div>';}
}

// Pinch zoom
(function(){
  const el=document.getElementById('hls-container');
  window.scale=1;window.lastDist=0;
})();

document.addEventListener('DOMContentLoaded',function(){initHLS();loadRecordings();setInterval(loadRecordings,30000);});

// Zoom functions (transform video element)
function getZoomEl(){
  var v = document.getElementById('hls-video');
  return v;
}

function applyZoom(){
  var el = getZoomEl();
  if (!el) return;
  el.style.transformOrigin = 'center center';
  el.style.transform = 'translate(' + (window.panX||0) + 'px,' + (window.panY||0) + 'px) scale(' + window.scale + ')';
}

function zoomIn(){ if(window.scale<4){window.scale+=0.5;applyZoom();} }
function zoomOut(){ if(window.scale>1){window.scale-=0.5;if(window.scale<1)window.scale=1;applyZoom();} }
function zoomReset(){ window.scale=1; window.panX=0; window.panY=0; applyZoom(); }

// Screenshot: grab current video frame and download as PNG
function downloadScreenshot(){
  var v = document.getElementById('hls-video');
  if (!v) { alert('No video'); return; }
  var canvas = document.createElement('canvas');
  canvas.width = v.videoWidth || 640;
  canvas.height = v.videoHeight || 480;
  var ctx = canvas.getContext('2d');
  ctx.drawImage(v, 0, 0, canvas.width, canvas.height);
  canvas.toBlob(function(blob){
    if (!blob) { alert('Failed'); return; }
    var a = document.createElement('a');
    var ts = new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
    a.href = URL.createObjectURL(blob);
    a.download = 'screenshot_' + ts + '.png';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
  }, 'image/png');
}

// Pan + Wheel zoom + Pinch zoom
(function(){
  var box = document.getElementById('hls-container');
  if (!box) return;
  var dragging = false, startX = 0, startY = 0, startPanX = 0, startPanY = 0;

  // Mouse drag to pan
  box.addEventListener('mousedown', function(e){
    if (window.scale <= 1) return;
    dragging = true;
    startX = e.clientX;
    startY = e.clientY;
    startPanX = window.panX || 0;
    startPanY = window.panY || 0;
    box.style.cursor = 'grabbing';
    e.preventDefault();
  });
  document.addEventListener('mousemove', function(e){
    if (!dragging) return;
    window.panX = startPanX + (e.clientX - startX);
    window.panY = startPanY + (e.clientY - startY);
    // clamp pan
    var v = document.querySelector('video');
    if (v){
      var maxX = v.clientWidth * (window.scale - 1) / 2;
      var maxY = v.clientHeight * (window.scale - 1) / 2;
      window.panX = Math.max(-maxX, Math.min(maxX, window.panX));
      window.panY = Math.max(-maxY, Math.min(maxY, window.panY));
    }
    applyZoom();
  });
  document.addEventListener('mouseup', function(){
    dragging = false;
    box.style.cursor = window.scale > 1 ? 'grab' : 'default';
  });

  // Wheel zoom at cursor position
  box.addEventListener('wheel', function(e){
    e.preventDefault();
    var rect = box.getBoundingClientRect();
    var cx = (e.clientX - rect.left) / rect.width;
    var cy = (e.clientY - rect.top) / rect.height;
    var oldScale = window.scale;
    if (e.deltaY < 0) zoomIn(); else zoomOut();
    if (window.scale !== oldScale && window.scale > 1){
      var v = document.querySelector('video');
      if (v){
        var maxX = v.clientWidth * (window.scale - 1) / 2;
        var maxY = v.clientHeight * (window.scale - 1) / 2;
        window.panX = (cx - 0.5) * 2 * maxX * -1;
        window.panY = (cy - 0.5) * 2 * maxY * -1;
        window.panX = Math.max(-maxX, Math.min(maxX, window.panX));
        window.panY = Math.max(-maxY, Math.min(maxY, window.panY));
      }
      applyZoom();
    }
  }, {passive:false});

  // Double click toggle
  box.addEventListener('dblclick', function(){
    if (window.scale > 1) zoomReset(); else zoomIn();
  });

  // Pinch touch zoom
  var lastDist = 0;
  box.addEventListener('touchstart', function(e){
    if (e.touches.length === 2){
      lastDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
    }else if (e.touches.length === 1 && window.scale > 1){
      dragging = true;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      startPanX = window.panX || 0;
      startPanY = window.panY || 0;
    }
  }, {passive:true});

  box.addEventListener('touchmove', function(e){
    if (e.touches.length === 2){
      e.preventDefault();
      var d = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      if (lastDist > 0){
        var ratio = d / lastDist;
        var newScale = Math.max(1, Math.min(4, window.scale * ratio));
        window.scale = Math.round(newScale * 2) / 2; // snap to 0.5
        applyZoom();
      }
      lastDist = d;
    }else if (dragging && e.touches.length === 1){
      window.panX = startPanX + (e.touches[0].clientX - startX);
      window.panY = startPanY + (e.touches[0].clientY - startY);
      var v = document.querySelector('video');
      if (v){
        var maxX = v.clientWidth * (window.scale - 1) / 2;
        var maxY = v.clientHeight * (window.scale - 1) / 2;
        window.panX = Math.max(-maxX, Math.min(maxX, window.panX));
        window.panY = Math.max(-maxY, Math.min(maxY, window.panY));
      }
      applyZoom();
    }
  }, {passive:false});

  box.addEventListener('touchend', function(){
    dragging = false;
    lastDist = 0;
  });
})();

</script>
</body>
